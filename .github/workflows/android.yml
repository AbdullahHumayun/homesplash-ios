name: Build Android TV APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on the "android-latest" release

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — signing with a throwaway debug key (updates won't install over each other)"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Homesplash-TV.apk"
          ls -lh "$GITHUB_WORKSPACE/Homesplash-TV.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$GITHUB_WORKSPACE/Homesplash-TV.apk" | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Homesplash-TV-apk
          path: Homesplash-TV.apk

      - name: Publish to the "android-latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Homesplash-TV.apk --prerelease \
            --title "Android TV build ${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes "Signed APK for Android TV. Install with a sideload app (e.g. Downloader / Send Files to TV) or adb install -r Homesplash-TV.apk."
