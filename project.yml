# XcodeGen spec — `xcodegen generate` creates Homesplash.xcodeproj (not committed).
name: Homesplash
options:
  bundleIdPrefix: com.abdullahhumayun
  deploymentTarget:
    iOS: "17.0"
targets:
  Homesplash:
    type: application
    platform: iOS
    sources:
      - Homesplash
    scheme: {}
    info:
      path: Homesplash/Info.plist
      properties:
        CFBundleDisplayName: Homesplash
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Homesplash reads your steps, heart rate, HRV, blood oxygen and sleep to show them on your home dashboard.
        NSHealthUpdateUsageDescription: Homesplash never writes to Apple Health.
        NSLocalNetworkUsageDescription: Homesplash sends your health summary to your dashboard server on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true      # the dashboard server is plain http on your LAN / Tailscale
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.abdullahhumayun.homesplash.refresh]
    entitlements:
      path: Homesplash/Homesplash.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullahhumayun.homesplash
        PRODUCT_NAME: Homesplash
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"          # signed later by Signulous
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
